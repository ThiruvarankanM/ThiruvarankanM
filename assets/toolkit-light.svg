<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Toolkit</title><desc id="d">AI and agents: Claude API, Tool use and MCP, LangGraph and LangChain, llama.cpp, RAG, Evals. Languages: Jac, TypeScript, Python, Go, C++, Java. Front end: React, Next.js, Tailwind CSS, Radix and shadcn, Motion, VS Code extensions. Back end and data: FastAPI, Node.js and Express, PostgreSQL, Supabase, Redis, Docker. Messaging and payments: Twilio WhatsApp, Meta Cloud API, Resend, Paddle, PayHere. Hardware: Arduino, PlatformIO, PID control, NI DAQ and LabVIEW, Sensors.</desc><style>@font-face{font-family:MonoX;font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:GeistX;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}.m500{font-family:MonoX,ui-monospace,monospace;font-weight:500;font-style:normal}.g400{font-family:GeistX,system-ui,sans-serif;font-weight:400;font-style:normal}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="340" rx="22" fill="#F1EEE6"/><text x="28" y="40.08" class="m500" font-size="10.5" fill="#5A5853" letter-spacing="0.84">AI AND AGENTS</text><rect x="28.5" y="54.5" width="86.63" height="27" rx="13.5" fill="#124C38" stroke="none"/><text x="40" y="72.5" class="g400" font-size="12.5" fill="#fff">Claude API</text><rect x="122.13" y="54.5" width="127.1" height="27" rx="13.5" fill="#124C38" stroke="none"/><text x="133.63" y="72.5" class="g400" font-size="12.5" fill="#fff">Tool use and MCP</text><rect x="28.5" y="89.5" width="176.81" height="27" rx="13.5" fill="#124C38" stroke="none"/><text x="40" y="107.5" class="g400" font-size="12.5" fill="#fff">LangGraph and LangChain</text><rect x="212.31" y="89.5" width="78.63" height="27" rx="13.5" fill="#124C38" stroke="none"/><text x="223.81" y="107.5" class="g400" font-size="12.5" fill="#fff">llama.cpp</text><rect x="2