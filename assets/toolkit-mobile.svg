<svg xmlns="http://www.w3.org/2000/svg" width="480" height="980" viewBox="0 0 480 980" role="img" aria-labelledby="t d"><title id="t">Toolkit</title><desc id="d">AI and agents: Claude API, Tool use and MCP, LangGraph and LangChain, llama.cpp, RAG, Evals. Languages: Jac, TypeScript, Python, Go, C++, Java. Front end: React, Next.js, Tailwind CSS, Radix and shadcn, Motion, VS Code extensions. Back end and data: FastAPI, Node.js and Express, PostgreSQL, Supabase, Redis, Docker. Messaging and payments: Twilio WhatsApp, Meta Cloud API, Resend, Paddle, PayHere. Hardware: Arduino, PlatformIO, PID control, NI DAQ and LabVIEW, Sensors.</desc><style>@font-face{font-family:MonoX;font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:GeistX;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}.m500{font-family:MonoX,ui-monospace,monospace;font-weight:500;font-style:normal}.g400{font-family:GeistX,system-ui,sans-serif;font-weight:400;font-style:normal}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="480" height="980" rx="22" fill="#161b22"/><text x="24" y="38.95" class="m500" font-size="13" fill="#A8A49B" letter-spacing="1.04">AI AND AGENTS</text><rect x="24.5" y="56.5" width="111.16" height="35" rx="17.5" fill="#1f6f52" stroke="none"/><text x="39.36" y="79.76" class="g400" font-size="16" fill="#fff">Claude API</text><rect x="142.66" y="56.5" width="162.97" height="35" rx="17.5" fill="#1f6f52" stroke="none"/><text x="157.52" y="79.76" class="g400" font-size="16" fill="#fff">Tool use and MCP</text><rect x="24.5" y="99.5" width="226.6" height="35" rx="17.5" fill="#1f6f52" stroke="none"/><text x="39.36" y="122.76" class="g400" font-size="16" fill="#fff">LangGraph and LangChain</text><rect x="258.1" y="99.5" width="100.92" height="35" rx="17.5" fill="#1f6f52" stroke="none"/><text x="272.96" y="122.76" class="g400" font-size="16" fill="#fff">llama.cpp</text><rect x="